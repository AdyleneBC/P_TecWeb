    <style>
        body {

            color: rgba(255,255,255,0.9);

            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .footer-links a:hover {
            opacity: 0.8;
        }

        .alert {
            border-radius: 5px;
            border: none;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;

            }

                opacity: 1;

        .alert-info {
            background: #d1ecf1;

</head>
<body>

    <div class="signup-wrapper">
        
        <div class="brand-header">
            <h1>ResourceApp</h1>
            <p>Crea tu cuenta gratis</p>
        </div>

        <div class="card signup-card">
            <div class="card-header">
                <h5>Registro de Usuario</h5>
            </div>
            
            <div class="card-body">
                
                <!-- Mensaje cuando vienen de una descarga -->
                <div id="download-message" class="alert alert-info mb-3" style="display:none;">
                    <strong>Registro Requerido</strong>
                    <p class="mb-0">Para descargar este recurso, necesitas crear una cuenta gratuita. Solo toma 30 segundos.</p>
                </div>

                <form action="/Proyecto_final/auth/process-signup.php" method="post" id="signup">
                    
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <input type="text" 
                               id="name" 
                               name="name" 
                               class="form-control" 
                               placeholder="Ej: Juan Pérez"
                               required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               class="form-control"
                               placeholder="tu@email.com"
                               required>
                        
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-control"
                               placeholder="Mínimo 8 caracteres"
                               required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password_confirmation">Confirmar Contraseña</label>
                        <input type="password" 
                               id="password_confirmation" 
                               name="password_confirmation" 
                               class="form-control"
                               placeholder="Repite tu contraseña"
                               required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-signup btn-block btn-lg">
                        Crear Cuenta Gratis
                    </button>
                    
                </form>

                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-2">
                        ¿Ya tienes cuenta? 
                        <a href="/Proyecto_final/auth/login.php" class="text-primary font-weight-bold">Inicia sesión</a>
                    </p>
                    <a href="/Proyecto_final/catalogo.php" class="text-muted">Volver al Catálogo</a>
                </div>

            </div>
        </div>

        <div class="footer-links">
            <a href="/Proyecto_final/">Inicio</a>
            <span style="color: rgba(255,255,255,0.5);">|</span>
            <a href="/Proyecto_final/catalogo.php">Catálogo</a>
        </div>

    </div>

    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>

    <!-- Script para detectar mensaje de descarga -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('message') === 'register_to_download') {
            document.getElementById('download-message').style.display = 'block';
            document.getElementById('download-message').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>

</body>
</html>
