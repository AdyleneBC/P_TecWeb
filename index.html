<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ResourceApp</title>

    <!-- BOOTSTRAP 4 (Bootswatch Slate) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/slate/bootstrap.min.css">

    <style>
        /* sidebar simple */
        #sidebar {
            min-height: 100vh;
            background: #222;
            padding-top: 20px;
        }

        #sidebar .nav-link {
            color: #ddd;
        }

        #sidebar .nav-link.active {
            background: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- ========================= -->
            <!-- SIDEBAR IZQUIERDA -->
            <!-- ========================= -->
            <div class="col-md-2" id="sidebar">
                <h5 class="text-center text-light mb-4">ResourceApp</h5>

                <ul class="nav flex-column nav-pills" id="sideMenu">
                    <li class="nav-item">
                        <a class="nav-link active" data-toggle="tab" href="#gestion">
                            Gestión de Recursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-toggle="tab" href="#catalogo">
                            Catálogo (Visitantes)
                        </a>
                    </li>
                </ul>
            </div>

            <!-- ========================= -->
            <!-- CONTENIDO PRINCIPAL -->
            <!-- ========================= -->
            <div class="col-md-10 p-4">

                <!-- BUSCADOR CENTRADO -->
                <div class="row mb-4">
                    <div class="col-md-6 mx-auto">
                        <form id="search-form" class="form-inline justify-content-center">
                            <input class="form-control mr-2 w-75" name="search" id="search" type="search"
                                placeholder="Buscar por nombre, autor, tipo...">
                            <button class="btn btn-success" type="submit">Buscar</button>
                        </form>
                    </div>
                </div>

                <!-- TABS -->
                <div class="tab-content" id="mainTabsContent">

                    <!-- ========================= -->
                    <!-- TAB 1: GESTIÓN / SUBIR -->
                    <!-- ========================= -->
                    <div class="tab-pane fade show active" id="gestion" role="tabpanel">

                        <div class="row">
                            <!-- FORMULARIO -->
                            <div class="col-md-5">
                                <div class="card">
                                    <div class="card-body">
                                        <form id="recurso-form">
                                            <div class="form-group">
                                                <input class="form-control" type="text" id="nombre"
                                                    placeholder="Nombre del recurso" maxlength="100">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="text" id="autor" placeholder="Autor"
                                                    maxlength="100">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="text" id="departamento"
                                                    placeholder="Departamento" maxlength="100">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="text" id="empresa"
                                                    placeholder="Empresa / Institución" maxlength="120">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="date" id="fecha_creacion">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <textarea class="form-control" id="descripcion" rows="3"
                                                    placeholder="Descripción (máx 250)" maxlength="250"></textarea>
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="text" id="tipo"
                                                    placeholder="Tipo/Extensión (pdf, zip, jar...)" maxlength="20">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="text" id="lenguaje"
                                                    placeholder="Lenguaje (php, js, java...)" maxlength="40">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <div class="form-group">
                                                <input class="form-control" type="file" id="archivo">
                                                <div class="invalid-feedback"></div>
                                            </div>

                                            <input type="hidden" id="recursoId">

                                            <button class="btn btn-primary btn-block text-center" type="submit">
                                                Agregar Recurso
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- LISTA ADMIN -->
                            <div class="col-md-7">
                                <div class="card my-4" id="recurso-result" style="display:none;">
                                    <div class="card-body">
                                        <ul id="container"></ul>
                                    </div>
                                </div>

                                <table class="table table-bordered table-sm">
                                    <thead>
                                        <tr>
                                            <td>ID</td>
                                            <td>Recurso</td>
                                            <td>Descripción</td>
                                            <td>Acción</td>
                                        </tr>
                                    </thead>
                                    <tbody id="recursos-admin"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- ========================= -->
                    <!-- TAB 2: CATÁLOGO -->
                    <!-- ========================= -->
                    <div class="tab-pane fade" id="catalogo" role="tabpanel">

                        <div class="card my-2">
                            <div class="card-body">
                                <h5 class="mb-3">Catálogo de Recursos Digitales</h5>

                                <table class="table table-bordered table-sm">
                                    <thead>
                                        <tr>
                                            <td>ID</td>
                                            <td>Nombre</td>
                                            <td>Tipo</td>
                                            <td>Lenguaje</td>
                                            <td>Descripción</td>
                                            <td>Descarga</td>
                                        </tr>
                                    </thead>
                                    <tbody id="recursos-catalogo"></tbody>
                                </table>

                            </div>
                        </div>

                    </div>

                </div><!-- tab-content -->
            </div><!-- col main -->
        </div><!-- row -->
    </div><!-- container-fluid -->


    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>

    <!-- Tu JS -->
    <script src="app.js"></script>

</body>

</html>
